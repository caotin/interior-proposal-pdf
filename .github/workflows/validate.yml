name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Validate package and quotation arithmetic
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise export and rejection cases
        run: npm test
      - name: Export the example
        run: |
          python scripts/check_quote.py examples/riverside-living/quote.json --output work/quote-report.json
          node scripts/render_pdf.mjs --html examples/riverside-living/proposal.html --pdf work/demo.pdf --screenshots work/pages --report work/render-report.json
          python tests/check_demo_pdf.py work/demo.pdf
          pdftoppm -scale-to 1200 -png work/demo.pdf work/pdf-page
      - name: Build the skill-only package
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: skill-and-demo-results
          path: |
            work/
            dist/
          if-no-files-found: ignore
